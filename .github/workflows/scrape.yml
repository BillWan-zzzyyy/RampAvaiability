name: Parking availability report

on:
  # Deliberately redundant: three firings an hour, because GitHub drops
  # scheduled runs. Measured on this repo: 10/10 firings a day through Aug 25,
  # then 6, 1, 1, 2, 3 on the following weekdays, with delays up to 201 minutes.
  # A single firing per hour is therefore not something to rely on.
  #
  # Whichever firing arrives first records its slot and emails; the rest find the
  # slot already recorded and exit in seconds without touching the source site
  # (scraper/precheck.py). Real work stays at 9 reports a day.
  #
  # 11:00-22:59 UTC spans 8am-4pm America/Chicago in both CDT (UTC-5) and CST
  # (UTC-6), with the early hours giving the 8am slot several chances to land
  # before the deadline; anything whose slot falls outside the window is dropped
  # in local time, so daylight saving still needs no cron edit.
  schedule:
    - cron: "5,25,45 11-22 * * 1-5"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and record but send no email"
        type: boolean
        default: false
      force:
        description: "Run even outside the weekday 8am-4pm window"
        type: boolean
        default: true
      force_chart:
        description: "Include the Ramp 17 chart as if this were the 4pm run"
        type: boolean
        default: false

  # Development only: pushes to the working branch do a dry run so the scraper
  # can be exercised end-to-end before the workflow lands on the default branch.
  push:
    branches: [claude/parking-lot-scraper-t7lzxw]
    paths:
      - "scraper/**"
      - requirements.txt
      - .github/workflows/scrape.yml

permissions:
  contents: write

concurrency:
  group: parking-scrape-v2
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # A wedged step must not sit burning Actions minutes until the 6h default;
    # this job normally finishes in about two minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Stdlib only, no dependencies installed yet: decides in about a second
      # whether this firing has a slot to fill, so redundant runs never pay the
      # ~70 seconds of Chromium install.
      - name: Is there a slot to fill?
        id: precheck
        if: github.event_name == 'schedule'
        run: python -m scraper.precheck

      - name: Cache Chromium
        if: github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # --with-deps shells out to apt, which on a runner with a held dpkg lock
      # can hang for many minutes. Cap it and fall back to the browser binary
      # alone, since the runner image already carries the shared libraries.
      - name: Install Chromium with system libraries
        if: github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true'
        id: browser_with_deps
        continue-on-error: true
        timeout-minutes: 6
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium without apt
        if: >-
          (github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true')
          && steps.browser_with_deps.outcome != 'success'
        run: python -m playwright install chromium

      - name: Scrape and send report
        if: github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--dry-run --force"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            if [ "${{ inputs.force_chart }}" = "true" ]; then ARGS="$ARGS --force-chart"; fi
          fi
          echo "running: python -m scraper.main $ARGS"
          python -m scraper.main $ARGS

      - name: Commit today's readings
        # Dev pushes would otherwise litter the history with off-schedule rows.
        if: >-
          github.event_name != 'push'
          && (github.event_name != 'schedule' || steps.precheck.outputs.proceed == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A run outside the local window writes nothing, and an absent data/
          # directory is not a failure.
          git add data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "data: parking availability $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            echo "push failed, rebasing and retrying ($attempt)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "could not push readings" >&2
          exit 1
